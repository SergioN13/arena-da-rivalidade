<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena da Rivalidade</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-glow glow-1"></div><div class="bg-glow glow-2"></div>

  <header class="topbar">
    <div>
      <span class="eyebrow">RIVALIDADE OFICIAL</span>
      <h1>⚔️ Arena da Rivalidade</h1>
    </div>
    <a class="admin-link" href="admin.html">Admin</a>
  </header>

  <main class="container">
    <section class="hero">
      <p id="statusMessage" class="status-message">Carregando placar...</p>
      <div class="scoreboard">
        <article id="cardVoce" class="player-card">
          <div class="player-badge">JOLA</div>
          <div id="vocePontos" class="score">0</div>
          <div class="wins"><span id="voceVitorias">0</span> vitórias</div>
        </article>

        <div class="versus">
          <span>VS</span>
          <small>PLACAR</small>
        </div>

        <article id="cardGabriel" class="player-card">
          <div class="player-badge">GABRIEL</div>
          <div id="gabrielPontos" class="score">0</div>
          <div class="wins"><span id="gabrielVitorias">0</span> vitórias</div>
        </article>
      </div>
    </section>

    <section class="stats-grid">
      <div class="stat-box"><span>Competições</span><strong id="totalCompeticoes">0</strong></div>
      <div class="stat-box"><span>Vitórias — Você</span><strong id="pctVoce">0%</strong></div>
      <div class="stat-box"><span>Vitórias — Gabriel</span><strong id="pctGabriel">0%</strong></div>
    </section>

    <section class="history-section">
      <div class="section-heading">
        <div>
          <span class="eyebrow">HISTÓRICO</span>
          <h2>Últimas batalhas</h2>
        </div>
        <span id="leaderTag" class="leader-tag">EMPATE</span>
      </div>
      <div id="history" class="history-list">
        <div class="empty">Nenhuma competição registrada.</div>
      </div>
    </section>
  </main>

  <div id="pointOverlay" class="point-overlay">
    <div class="point-animation">+1</div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
